<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体办公区 | Fantasy3D 自治商店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:#0a0f14;color:#e9edf2;min-height:100vh;}
.header{background:#111a22;border-bottom:1px solid #222f3b;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;}
.logo{width:32px;height:32px;border:1px solid #c9a96e;color:#c9a96e;display:grid;place-items:center;border-radius:4px;font-weight:bold;}
.brand-title{color:#fff;font-size:16px;font-weight:bold;}
.brand-sub{color:#8a98a5;font-size:11px;}
.nav a{color:#b0bcc7;text-decoration:none;margin-left:16px;font-size:14px;}
.nav a.active{color:#c9a96e;}
.clock{color:#71d085;font-family:monospace;font-size:14px;}
.office-wrap{max-width:1400px;margin:0 auto;padding:16px 20px;}
.office-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.office-title h2{color:#c9a96e;font-size:20px;}
.office-title .status{color:#71d085;font-size:13px;}

/* 场景 */
.scene{
  position:relative;width:100%;aspect-ratio:2/1;
  background-image:url('office-bg.png');background-size:100% 100%;
  border-radius:14px;border:2px solid #3a4a5d;overflow:hidden;
}

/* 2D 卡通员工：不再依赖尺寸不一致的外部人物图片 */
.agent{
  --coat:#3f7ccc;--hair:#2d1d16;--skin:#f2c49c;
  position:absolute;z-index:5;width:7%;height:22%;
  transition:left 2.2s linear, top 2.2s linear;
  filter:drop-shadow(1px 2px 3px rgba(0,0,0,0.35));
}
.agent.manager{--coat:#9b3f36;--hair:#1e1815;}
.agent.researcher{--coat:#477b58;--hair:#4a2c1b;}
.agent.recommendation{--coat:#3e79b8;--hair:#20150f;}
.agent.support{--coat:#bb5b79;--hair:#513025;}
.agent.order{--coat:#8b6838;--hair:#25211d;}
.agent.listing{--coat:#7155a3;--hair:#39251e;}
.agent.inspector{--coat:#555d69;--hair:#171717;z-index:8;}
.figure{position:absolute;left:50%;bottom:0;width:78%;height:100%;transform:translateX(-50%);}
.head{position:absolute;left:29%;top:4%;width:43%;height:29%;border-radius:48% 48% 44% 44%;background:var(--skin);border:2px solid #422c24;z-index:3;}
.head::before{content:'';position:absolute;left:-5%;top:-15%;width:110%;height:42%;border-radius:55% 55% 30% 30%;background:var(--hair);}
.head::after{content:'• •';position:absolute;top:45%;left:19%;color:#382016;font-size:10px;letter-spacing:4px;white-space:nowrap;}
.body{position:absolute;left:20%;top:30%;width:60%;height:46%;border-radius:34% 34% 12% 12%;background:var(--coat);border:2px solid #30241f;z-index:2;}
.body::after{content:'';position:absolute;left:42%;top:5%;height:83%;border-left:2px solid rgba(255,255,255,.45);}
.arm{position:absolute;top:37%;width:24%;height:31%;border-radius:15px;background:var(--skin);border:2px solid #422c24;z-index:1;}
.arm.left{left:8%;transform:rotate(24deg);}.arm.right{right:8%;transform:rotate(-24deg);}
.lap{position:absolute;left:15%;bottom:0;width:70%;height:24%;border-radius:55% 55% 12% 12%;background:#27313b;border:2px solid #20252b;}
.agent.walk .lap{display:none;}.agent.walk .body{height:52%;}.agent.walk .arm{top:43%;}

.agent .name{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:bold;white-space:nowrap;padding:1px 6px;border-radius:4px;
  background:rgba(0,0,0,0.75);color:#fff;border:1px solid #c9a96e;z-index:6;
}
.agent .bubble{
  position:absolute;top:-54px;left:50%;transform:translateX(-50%);
  background:#fff;color:#333;font-size:10px;padding:4px 8px;border-radius:8px;
  max-width:130px;text-align:center;line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.3);
  word-break:break-all;z-index:20;display:none;
}
.agent .bubble::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid #fff;}

/* 坐着工作：轻微晃动 */
.agent.sit{animation:sitBob 1.8s ease-in-out infinite;}
@keyframes sitBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-1.5%);}}

/* 走路：左右摆+上下颠 */
.agent.walk{animation:walkMove .4s linear infinite;}
@keyframes walkMove{
  0%{transform:rotate(-4deg) translateY(0);}
  25%{transform:rotate(0) translateY(-3%);}
  50%{transform:rotate(4deg) translateY(0);}
  75%{transform:rotate(0) translateY(-3%);}
}

/* 状态条 */
.status-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.status-chip{background:#111a22;border:1px solid #222f3b;border-radius:6px;padding:6px 10px;font-size:11px;display:flex;align-items:center;gap:6px;}
.status-chip .dot{width:8px;height:8px;border-radius:50%;}
.status-chip .dot.on{background:#71d085;animation:pulse 2s infinite;}
.status-chip .dot.work{background:#e6b249;animation:pulse 1s infinite;}
.status-chip .dot.walk{background:#4a90d9;animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.stats-panel{margin-top:14px;background:#111a22;border:1px solid #222f3b;border-radius:10px;padding:14px;}
.stats-panel h4{color:#c9a96e;margin-bottom:10px;font-size:14px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.stat-card{background:#0d1520;border-radius:8px;padding:10px;text-align:center;}
.stat-card .num{font-size:22px;font-weight:bold;}
.stat-card .label{font-size:11px;color:#8a98a5;margin-top:2px;}
.legend{margin-top:10px;font-size:12px;color:#8a98a5;line-height:1.7;}

@media(max-width:768px){.agent .name{font-size:8px;}.agent .bubble{font-size:9px;max-width:85px;}}
</style>
</head>
<body>
<header class="header">
  <a href="store.html" class="brand">
    <span class="logo">寺</span>
    <span><span class="brand-title">Fantasy 3D</span><br><span class="brand-sub">AI 自治资产商店</span></span>
  </a>
  <nav class="nav">
    <a href="store.html">商店</a>
    <a href="office.html" class="active">办公区</a>
    <a href="agents.html">智能体</a>
    <a href="orders.html">订单</a>
    <a href="about.html">关于</a>
  </nav>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="office-wrap">
  <div class="office-title">
    <h2>🏢 智能体办公区 · 实时监控</h2>
    <span><button id="workflowButton" type="button">运行一轮工作流</button> <button id="meetingButton" type="button">召开运营会议</button> <span class="status" id="overallStatus">● 正在同步任务</span></span>
  </div>
  <div class="scene" id="scene"></div>
  <div class="status-bar" id="statusBar"></div>
  <div class="legend">说明：小人坐在工位办公时身体会轻微晃动；总稽查（持斧）会起身在办公区走动巡查；到点全体起身走到右侧会议室围坐开会，会后走回工位。</div>

  <div class="stats-panel" style="margin-top:12px;">
    <h4>🧭 工作流记录</h4>
    <div class="stats-grid">
      <div class="stat-card"><div class="num" id="workflowDone">0</div><div class="label">已记录任务</div></div>
      <div class="stat-card"><div class="num" id="workflowDrafts">0</div><div class="label">待审核推广草稿</div></div>
      <div class="stat-card"><div class="num" id="workflowPublished">0</div><div class="label">已发布推广</div></div>
      <div class="stat-card"><div class="num" id="workflowOrders">0</div><div class="label">真实订单</div></div>
    </div>
  </div>

  <div class="stats-panel">
    <h4>📊 商店访问统计</h4>
    <div class="stats-grid">
      <div class="stat-card"><div class="num" style="color:#71d085;" id="statTotal">--</div><div class="label">总访问量</div></div>
      <div class="stat-card"><div class="num" style="color:#e6b249;" id="statToday">--</div><div class="label">今日访问</div></div>
      <div class="stat-card"><div class="num" style="color:#4a90d9;" id="statUnique">--</div><div class="label">独立访客</div></div>
      <div class="stat-card"><div class="num" style="color:#e67e22;" id="statProducts">--</div><div class="label">在售商品</div></div>
    </div>
  </div>
</div>

<script>
// 7个智能体。seat=工位坐标(椅子精确位置，小人中心对齐椅子，桌面遮挡腰以下)
const AGENTS = [
  {id:'manager',        cls:'manager',        name:'大当家',  seat:{x:15.5,y:55}, h:21, task:'统筹全局，制定战略'},
  {id:'researcher',     cls:'researcher',     name:'插千的',  seat:{x:36.0,y:37}, h:17, task:'雷达扫描，采集资源'},
  {id:'recommendation', cls:'recommendation', name:'炮头',    seat:{x:45.0,y:37}, h:17, task:'对外推广，主动获客'},
  {id:'support',        cls:'support',        name:'水香',    seat:{x:54.0,y:37}, h:17, task:'接待客户，解答咨询'},
  {id:'order',          cls:'order',          name:'粮台',    seat:{x:63.0,y:37}, h:17, task:'管理订单，智能定价'},
  {id:'listing',        cls:'listing',        name:'翻垛的',  seat:{x:40.5,y:64}, h:17, task:'生产上架，优化描述'},
  {id:'inspector',      cls:'inspector',      name:'总稽查',  seat:{x:58.5,y:64}, h:18, task:'全店巡查，查重整改'}
];

// 会议室圆桌7个座位
const MEET = [
  {x:76,y:34},{x:82,y:27},{x:89,y:28},{x:93,y:39},
  {x:92,y:57},{x:86,y:65},{x:78,y:58}
];

const scene = document.getElementById('scene');
const els = {};
let mode = 'work'; // work / patrol / meeting

function init(){
  AGENTS.forEach((a,i)=>{
    const el = document.createElement('div');
    el.className = 'agent '+a.cls;
    el.id='ag-'+a.id;
    el.style.width = a.h+'%';
    el.innerHTML = `<div class="name">${a.name}</div><div class="bubble" id="bb-${a.id}"></div><div class="figure" aria-hidden="true"><div class="head"></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="lap"></div></div>`;
    scene.appendChild(el);
    els[a.id]=el;
    sit(a);
  });
  updateBar();
}

// 坐到工位（top 让小人腰部以下被桌面遮挡）
function sit(a){
  const el=els[a.id];
  el.style.left=a.seat.x+'%';
  el.style.top=a.seat.y+'%';
  el.className='agent '+a.cls+' sit';
}
// 走到某位置
function walkTo(id,x,y){
  const el=els[id];
  el.style.left=x+'%';
  el.style.top=y+'%';
  el.className='agent '+AGENTS.find(a=>a.id===id).cls+' walk';
}
function bubble(id,text){
  const b=document.getElementById('bb-'+id);
  b.textContent=text;b.style.display='block';
  clearTimeout(b._t);b._t=setTimeout(()=>b.style.display='none',5000);
}

// 总稽查巡查路线（在两排工位之间来回走）
const patrolPath=[{x:36,y:52},{x:45,y:52},{x:54,y:52},{x:62,y:52},{x:54,y:55},{x:45,y:55},{x:36,y:55}];
let patrolIdx=0;
function patrolStep(){
  if(mode!=='patrol')return;
  const p=patrolPath[patrolIdx%patrolPath.length];
  walkTo('inspector',p.x,p.y);
  bubble('inspector',['巡查中…','检查商品','核对价格','有无重复'][patrolIdx%4]);
  patrolIdx++;
}

// 开会流程
function startMeeting(){
  mode='meeting';
  document.getElementById('overallStatus').textContent='🤝 团队会议中';
  AGENTS.forEach((a,i)=>{
    const m=MEET[i];
    setTimeout(()=>{walkTo(a.id,m.x,m.y);},i*250);
    setTimeout(()=>{
      els[a.id].className='agent '+a.cls+' sit';
      bubble(a.id,a.task);
    },2400+i*250);
  });
}
function endMeeting(){
  mode='work';
  document.getElementById('overallStatus').textContent='● 办公中';
  AGENTS.forEach((a,i)=>{
    setTimeout(()=>{walkTo(a.id,a.seat.x,a.seat.y);},i*200);
    setTimeout(()=>sit(a),2400+i*200);
  });
}

// 巡查流程
function startPatrol(){
  mode='patrol';
  document.getElementById('overallStatus').textContent='🪓 总稽查巡查中';
  patrolIdx=0;
  patrolStep();
}
function stopPatrol(){
  const a=AGENTS.find(x=>x.id==='inspector');
  sit(a);
  mode='work';
  document.getElementById('overallStatus').textContent='● 办公中';
}

// 动画循环：工作20s → 巡查8s → 工作 → 开会12s → 循环
let cycle=0;
function schedule(){
  setInterval(()=>{
    cycle++;
    const phase=cycle%4;
    if(phase===1){ startPatrol(); setTimeout(()=>{ if(mode==='patrol')stopPatrol(); },9000); }
    if(phase===3){ startMeeting(); setTimeout(endMeeting,13000); }
  },14000);
  // 巡查时持续走
  setInterval(()=>{ if(mode==='patrol')patrolStep(); },2300);
  // 工作时偶尔冒气泡
  setInterval(()=>{
    if(mode==='work'){
      const a=AGENTS[Math.floor(Math.random()*6)]; // 不含巡查中的总稽查
      bubble(a.id,a.task);
    }
  },4000);
}

function updateBar(){
  const bar=document.getElementById('statusBar');
  bar.innerHTML='';
  AGENTS.forEach(a=>{
    const c=document.createElement('div');
    c.className='status-chip';
    const cls = (a.id==='inspector'&&mode==='patrol')?'walk':(mode==='meeting'?'work':'on');
    const txt = (a.id==='inspector'&&mode==='patrol')?'巡查中':(mode==='meeting'?'开会中':'办公中');
    c.innerHTML=`<span class="dot ${cls}"></span>${a.name}：${txt}`;
    bar.appendChild(c);
  });
}

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN');}
function fetchStats(){
  fetch('/api/stats/visits').then(r=>r.json()).then(d=>{
    document.getElementById('statTotal').textContent=d.total.toLocaleString();
    document.getElementById('statToday').textContent=d.today.toLocaleString();
    document.getElementById('statUnique').textContent=d.uniqueVisitors.toLocaleString();
  }).catch(()=>{});
  fetch('/api/store/products').then(r=>r.json()).then(d=>{
    document.getElementById('statProducts').textContent=d.products.length;
  }).catch(()=>{});
}

let lastMeetingId = null;
function applyAgentState(remoteAgents, tasks){
  const taskByAgent = new Map();
  (tasks || []).forEach(t=>{ if(!taskByAgent.has(t.agentId)) taskByAgent.set(t.agentId,t); });
  AGENTS.forEach(a=>{
    const remote=(remoteAgents || []).find(x=>x.id===a.id);
    const task=taskByAgent.get(a.id);
    const text=(task && task.title) || (remote && remote.currentTask) || '待命';
    if(text) bubble(a.id,text);
    if(remote && remote.status==='working') els[a.id].className='agent '+a.cls+' sit';
    else sit(a);
  });
  const active=(remoteAgents || []).filter(x=>x.status==='working').length;
  document.getElementById('overallStatus').textContent=active ? `● ${active} 个智能体有已记录任务` : '● 等待下一项已记录任务';
  updateBar();
}
async function syncOffice(){
  try{
    const [agentsRes,tasksRes,meetingsRes]=await Promise.all([fetch('/api/agents'),fetch('/api/store/tasks'),fetch('/api/store/meetings')]);
    const agents=await agentsRes.json(), tasks=await tasksRes.json(), meetings=await meetingsRes.json();
    applyAgentState(agents.agents,tasks.tasks);
    const latest=(meetings.meetings || [])[0];
    if(latest && latest.id!==lastMeetingId && Date.now()-new Date(latest.timestamp).getTime()<45000){
      lastMeetingId=latest.id; startMeeting(); setTimeout(endMeeting,9000);
    }
  }catch(_){ document.getElementById('overallStatus').textContent='○ 无法连接本地服务'; }
}
async function syncWorkflow(){
  try{
    const result=await fetch('/api/store/workflow');
    const workflow=await result.json();
    document.getElementById('workflowDone').textContent=workflow.completedTasks || 0;
    document.getElementById('workflowDrafts').textContent=workflow.promotionDrafts || 0;
    document.getElementById('workflowPublished').textContent=workflow.publishedPromotions || 0;
    document.getElementById('workflowOrders').textContent=workflow.realOrders || 0;
  }catch(_){}
}
async function runWorkflow(){
  const button=document.getElementById('workflowButton'); button.disabled=true;
  try{ await fetch('/api/store/workflow/run',{method:'POST'}); await syncOffice(); await syncWorkflow(); }
  finally{ button.disabled=false; }
}
async function requestMeeting(){
  const button=document.getElementById('meetingButton'); button.disabled=true;
  try{ await fetch('/api/store/meeting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:'运营任务复盘'})}); await syncOffice(); }
  finally{ button.disabled=false; }
}

window.addEventListener('load',()=>{
  init();
  updateClock();setInterval(updateClock,1000);
  document.getElementById('meetingButton').addEventListener('click',requestMeeting);
  document.getElementById('workflowButton').addEventListener('click',runWorkflow);
  fetchStats();setInterval(fetchStats,30000);
  syncOffice();syncWorkflow();setInterval(syncOffice,10000);setInterval(syncWorkflow,10000);
  setInterval(updateBar,1500);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品管理 | Fantasy3D 自治资产商店</title>
<link rel="stylesheet" href="store.css">
<script src="shared.js" defer></script>
<script src="admin.js" defer></script>
</head>
<body>
<div class="app">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <span class="logo-mark" aria-hidden="true">寺</span>
        <span><span class="brand-title">Fantasy 3D</span><span class="brand-sub">商品管理后台</span></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">首页</a>
        <a href="store.html">商店</a>
        <a href="office.html">办公区</a>
        <a href="agents.html">智能体</a>
        <a href="orders.html">订单</a>
        <a href="about.html">关于</a>
        <a href="contact.html">联系</a>
        <a href="admin.html" class="active" aria-current="page">管理</a>
      </nav>
    </div>
  </header>
  <aside class="demo-banner" aria-label="Store notice" style="background:linear-gradient(90deg,#1a2f1a,#0f1f0f);border-color:#2d5a2d;">
    <strong>商品上下架管理</strong>
    <span>此处调整商品的上架 / 草稿状态，改动实时生效并由智能体团队同步维护。</span>
    <small id="serviceStatus" role="status">正在连接商店服务…</small>
  </aside>
  <main class="admin-wrap">
    <h1 class="admin-title">商品管理</h1>
    <p class="page-intro">管理全部商品的上架与下架，智能体团队会自动查重、质检并维护分类与定价。</p>
    <button type="button" id="reloadProducts" class="filter-btn">重新加载</button>
    <p id="adminMessage" class="feedback" role="status">正在加载商品目录…</p>
    <div class="table-scroll">
      <table class="product-table">
        <caption class="sr-only">商品管理列表</caption>
        <thead><tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">分类</th><th scope="col">价格</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </main>
  <footer class="site-footer"><p>Fantasy3D ©2026 · AI 自治 3D 资产商店 · 付款确认后交付</p></footer>
</div>
</body>
</html>
